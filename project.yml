name: ClaudeUsageMeter

settings:
  DEVELOPMENT_TEAM: "2Y64BNQ29J"
  # プロビジョニングプロファイルを使わずに署名する。無料のPersonal Teamのプロファイルは
  # 7日で失効し、失効後はアプリが起動できなくなるため。プロファイルが必要な権限
  # (App Groups / keychain-access-groups)は使わない。
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "Apple Development"
  PROVISIONING_PROFILE_SPECIFIER: ""
  SWIFT_VERSION: 5.9

packages:
  Shared:
    path: Sources/Shared

targets:
  ClaudeUsageMeter:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/MenuBarApp
    dependencies:
      - package: Shared
        product: ClaudeUsageCore
    info:
      path: Resources/Info-App.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: "public.app-category.utilities"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2024. All rights reserved."
        NSLocalNetworkUsageDescription: "Claude Usage Meter needs to access network to fetch usage information."
    entitlements:
      path: Resources/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      PRODUCT_NAME: ClaudeUsageMeter
      PRODUCT_BUNDLE_IDENTIFIER: dev.local.claudeusagemeter
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
